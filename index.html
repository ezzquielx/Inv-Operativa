<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portafolio de actividades y trabajos prácticos de Investigación Operativa.">
  <title>Investigación Operativa - Actividades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrap">
    <header>
      <p class="eyebrow" id="materia-etiqueta"></p>
      <h1 id="materia-titulo"></h1>
      <p class="lead" id="materia-descripcion"></p>
      <div class="meta" id="materia-datos"></div>
      <nav id="indice" aria-label="Actividades"></nav>
    </header>

    <main id="actividades"></main>

    <footer id="pie"></footer>
  </div>

  <!-- Visor de imágenes (se abre al hacer clic en una captura) -->
  <div class="visor" id="visor" hidden>
    <button class="visor__cerrar" id="visor-cerrar" type="button" aria-label="Cerrar visor">&times;</button>
    <img class="visor__img" id="visor-img" alt="">
    <p class="visor__pie" id="visor-pie"></p>
  </div>

  <script src="scripts.js"></script>
</body>

</html>
